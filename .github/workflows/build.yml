name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build mod jar
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hellaverse-jar
          path: build/libs/*.jar
      - name: Read mod version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      # Publica/atualiza a release "v<mod_version>" com o jar. Para uma nova release, aumente mod_version.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: The Boys Hellaverse v${{ steps.ver.outputs.version }}
          body: |
            Minecraft 1.20.1 / Forge 47.3.0.
            Baixe o arquivo `hellaverse-${{ steps.ver.outputs.version }}.jar` abaixo e coloque na pasta `mods`.
          files: build/libs/*.jar
