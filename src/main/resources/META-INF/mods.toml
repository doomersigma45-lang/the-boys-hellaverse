modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Dependencias obrigatorias: o jogo nao abre sem estes dois mods.
[[dependencies.${mod_id}]]
    modId="compound_v"
    mandatory=true
    versionRange="${compound_v_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="compound_v_tweaks"
    mandatory=true
    versionRange="${compound_v_tweaks_version_range}"
    ordering="AFTER"
    side="BOTH"

# Mods obrigatorios: sem eles o Forge nem carrega o Hellaverse.
[[dependencies.${mod_id}]]
    modId="compound_v"
    mandatory=true
    versionRange="[2.3.6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="compound_v_tweaks"
    mandatory=true
    versionRange="[5.2.0,)"
    ordering="AFTER"
    side="BOTH"
